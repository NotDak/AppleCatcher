<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b111a" />
  <title>Turbo Highway</title>
  <style>
    :root {
      --bg-1: #0b111a;
      --bg-2: #171f2b;
      --road: #1e2833;
      --lane: rgba(255,255,255,0.7);
      --grass: #1b6f38;
      --grass-dark: #0f4d27;
      --hud: rgba(10, 14, 20, 0.6);
      --accent: #5cd2ff;
      --text: #edf7ff;
      --danger: #ff5b5b;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
      color: var(--text); font-family: Arial, sans-serif;
      touch-action: none;
    }

    body {
      display: flex; align-items: center; justify-content: center;
      padding: max(12px, env(safe-area-inset-top)) 0 max(12px, env(safe-area-inset-bottom));
    }

    #gameWrap {
      position: relative; width: min(96vw, 460px); height: min(92vh, 820px);
      border: 4px solid #203046; border-radius: 22px; overflow: hidden;
      background: linear-gradient(180deg, #15202d, #0b111a 48%, #0b111a);
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    }

    canvas {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block;
      background: linear-gradient(180deg, #2a3f53 0%, #0d1320 40%, #0b111a 100%);
    }

    .hud {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      z-index: 10;
      pointer-events: none;
    }

    .panel {
      background: var(--hud); border: 2px solid rgba(255,255,255,0.12);
      border-radius: 12px; padding: 8px 10px; font-weight: bold; box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      font-size: clamp(12px, 2.8vw, 16px);
    }

    .menu {
      position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
      background: rgba(6,10,15,0.55);
    }

    .menu.hidden { display: none; }

    .panelBox {
      width: min(86vw, 320px); background: rgba(19,25,31,0.9);
      border: 2px solid rgba(255,255,255,0.15); border-radius: 18px; padding: 18px 16px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.25);
    }

    h1 {
      margin: 0 0 12px; font-size: clamp(26px, 7vw, 38px); text-align: center;
    }

    .pickerRow {
      display: flex; flex-direction: column; gap: 8px; margin: 12px 0;
    }

    label {
      font-weight: bold; opacity: 0.9;
    }

    select, button {
      border: none; border-radius: 12px; font-size: 18px; font-weight: bold; padding: 12px 14px;
    }

    select {
      background: #eef5ff; color: #1c2630; width: 100%;
    }

    button {
      width: 100%; background: linear-gradient(180deg, #6ee6ff, #39a7ff); color: #0b1724; cursor: pointer;
      box-shadow: 0 10px 18px rgba(52,156,255,0.3);
    }

    .footer {
      text-align: center; font-size: 12px; opacity: 0.7; margin-top: 12px;
    }
  </style>
</head>
<body>
  <div id="gameWrap">
    <canvas id="gameCanvas" width="420" height="760"></canvas>

    <div class="hud">
      <div class="panel">Score: <span id="score">0</span></div>
      <div class="panel">Top Speed: <span id="speed">0</span> km/h</div>
      <div class="panel">Best: <span id="best">0</span></div>
    </div>

    <div class="menu" id="menu">
      <div class="panelBox">
        <h1>Turbo Highway</h1>
        <div class="pickerRow">
          <label for="carSelect">Pick your ride</label>
          <select id="carSelect">
            <option value="bmw">BMW</option>
            <option value="civic">Honda Civic</option>
            <option value="range">Range Rover</option>
          </select>
        </div>
        <button id="startBtn">Start Run</button>
        <div class="footer">Cut in and out of traffic to gain points.</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const menu = document.getElementById('menu');
    const carSelect = document.getElementById('carSelect');
    const startBtn = document.getElementById('startBtn');
    const scoreEl = document.getElementById('score');
    const speedEl = document.getElementById('speed');
    const bestEl = document.getElementById('best');

    const CAR_DEFS = {
      bmw: { name: 'BMW', color: '#5ac8fa', maxSpeed: 120, handling: 1.25, width: 44, height: 82 },
      civic: { name: 'Honda Civic', color: '#ff5d5d', maxSpeed: 110, handling: 1.1, width: 42, height: 80 },
      range: { name: 'Range Rover', color: '#52d68b', maxSpeed: 100, handling: 0.9, width: 48, height: 86 }
    };

    let score = 0;
    let best = Number(localStorage.getItem('turboHighwayBest') || 0);
    bestEl.textContent = best;

    let activeCar = 'bmw';
    let gameRunning = false;
    let lastTime = 0;
    let playerLane = 1;
    let laneTarget = 1;
    let pX = 0;
    let roadScroll = 0;
    let traffic = [];
    let streak = 0;
    let speedMph = 0;
    let time = 0;
    let laneCutCooldown = 0;
    let lastLaneChange = 0;

    const road = {
      left: 0,
      right: 0,
      width: 0,
      laneCount: 3,
      horizon: 0,
      baseY: 0,
    };

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.max(320, rect.width) * ratio;
      canvas.height = Math.max(560, rect.height) * ratio;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      road.horizon = canvas.height * 0.22;
      road.baseY = canvas.height * 0.95;
    }

    function resetRoad() {
      road.left = canvas.width * 0.20;
      road.right = canvas.width * 0.80;
      road.width = road.right - road.left;
      pX = laneToX(playerLane);
    }

    function laneToX(lane) {
      const laneWidth = road.width / road.laneCount;
      return road.left + laneWidth * (lane + 0.5);
    }

    function xForLane(lane, z) {
      const laneWidth = road.width / road.laneCount;
      return road.left + laneWidth * (lane + 0.5) + (z * 0.16 * (Math.sin((lane + 1) * 1.4) * 18));
    }

    function getCarStats() {
      return CAR_DEFS[activeCar];
    }

    function setCarSelection() {
      activeCar = carSelect.value;
    }

    function startGame() {
      setCarSelection();
      score = 0;
      best = Number(localStorage.getItem('turboHighwayBest') || 0);
      bestEl.textContent = best;
      playerLane = 1;
      laneTarget = 1;
      roadScroll = 0;
      scoreEl.textContent = '0';
      speedMph = 70;
      time = 0;
      streak = 0;
      laneCutCooldown = 0;
      lastLaneChange = 0;
      traffic = [];
      for (let i = 0; i < 8; i++) {
        spawnTraffic(i * 96 + 140);
      }
      menu.classList.add('hidden');
      gameRunning = true;
      lastTime = 0;
      requestAnimationFrame(loop);
    }

    function spawnTraffic(offset = 0) {
      const lane = Math.floor(Math.random() * 3);
      const carType = ['bmw', 'civic', 'range'][Math.floor(Math.random() * 3)];
      const stats = CAR_DEFS[carType];
      traffic.push({
        lane,
        x: laneToX(lane),
        y: -offset - Math.random() * 120,
        width: stats.width,
        height: stats.height,
        color: stats.color,
        speed: 120 + Math.random() * 80,
        type: carType,
        turbo: Math.random() > 0.35,
        passed: false,
        scored: false,
      });
    }

    function updatePlayerTargetFromPointer(clientX) {
      if (!gameRunning) return;
      const rect = canvas.getBoundingClientRect();
      const nx = (clientX - rect.left) / rect.width;
      const desiredLane = Math.min(2, Math.max(0, Math.floor(nx * 3)));
      laneTarget = desiredLane;
    }

    function handlePointer(e) {
      updatePlayerTargetFromPointer(e.clientX);
    }

    canvas.addEventListener('pointerdown', handlePointer);
    canvas.addEventListener('pointermove', (e) => {
      if (e.pressure > 0 || e.pointerType === 'touch') handlePointer(e);
    });

    document.addEventListener('keydown', (e) => {
      if (!gameRunning) return;
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') laneTarget = Math.max(0, laneTarget - 1);
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') laneTarget = Math.min(2, laneTarget + 1);
    });

    startBtn.addEventListener('click', startGame);
    carSelect.addEventListener('change', setCarSelection);

    function update() {
      const dt = Math.min(32, (lastTime ? (performance.now() - lastTime) : 16));
      lastTime = performance.now();
      if (!gameRunning) return;

      time += dt;
      speedMph = Math.min(getCarStats().maxSpeed, 65 + (time * 0.025));
      roadScroll += dt * 0.32 + speedMph * 0.02;

      playerLane += (laneTarget - playerLane) * 0.14;
      pX = laneToX(playerLane);

      laneCutCooldown = Math.max(0, laneCutCooldown - dt);
      if (Math.abs(playerLane - laneTarget) > 0.1) {
        lastLaneChange += dt;
      }

      for (let i = traffic.length - 1; i >= 0; i--) {
        const car = traffic[i];
        const carSpeed = (car.speed + speedMph * 0.5) * (dt / 16);
        car.y += carSpeed;

        if (!car.scored && car.y > canvas.height * 0.82) {
          if (Math.abs(car.lane - playerLane) <= 0.15) {
            crash();
          } else {
            const distancePenalty = Math.abs(car.lane - playerLane);
            const value = Math.max(4, 15 - distancePenalty * 5 + streak * 0.6);
            score += Math.round(value);
            scoreEl.textContent = score;
            car.scored = true;
          }
        }

        if (Math.abs(car.lane - playerLane) <= 0.2 && car.y > canvas.height * 0.36 && car.y < canvas.height * 0.82) {
          const laneShift = Math.abs(playerLane - lastLaneChange * 0.001);
          if (Math.abs(playerLane - laneTarget) > 0.38 && laneCutCooldown <= 0) {
            score += 12;
            streak += 1;
            scoreEl.textContent = score;
            laneCutCooldown = 420;
            playBurst();
          }
        }

        if (car.y > canvas.height + 80) {
          traffic.splice(i, 1);
          spawnTraffic(Math.random() * 180);
        }
      }

      if (Math.random() < 0.014 + (score * 0.0005)) {
        spawnTraffic(-80);
      }

      if (score > best) {
        best = score;
        localStorage.setItem('turboHighwayBest', String(best));
        bestEl.textContent = best;
      }

      speedEl.textContent = Math.round(speedMph);
      scoreEl.textContent = score;
    }

    function crash() {
      gameRunning = false;
      menu.classList.remove('hidden');
      startBtn.textContent = 'Restart Run';
      const title = document.querySelector('#menu h1');
      title.textContent = 'Crash!';
      const footer = document.querySelector('.footer');
      footer.textContent = 'You scored ' + score + ' points. Try again.';
      if (score > best) {
        best = score;
        localStorage.setItem('turboHighwayBest', String(best));
        bestEl.textContent = best;
      }
    }

    function playBurst() {
      const osc = new AudioContext();
      const o = osc.createOscillator();
      const g = osc.createGain();
      o.type = 'triangle';
      o.frequency.value = 420 + Math.random() * 180;
      g.gain.value = 0.04;
      o.connect(g); g.connect(osc.destination);
      o.start();
      o.stop(osc.currentTime + 0.08);
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, '#395b7d');
      sky.addColorStop(0.45, '#1b2a35');
      sky.addColorStop(1, '#0d1119');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#2a7d52';
      ctx.fillRect(0, canvas.height * 0.65, canvas.width, canvas.height * 0.35);

      ctx.fillStyle = '#1f5d39';
      for (let i = 0; i < 30; i++) {
        const x = (i * 87 + (roadScroll * 0.6)) % (canvas.width + 100);
        const h = 22 + (i % 4) * 15;
        ctx.fillRect(x, canvas.height * 0.7 + (i % 3) * 14, 42, h);
      }

      ctx.fillStyle = '#2f3c48';
      const roadLeft = canvas.width * 0.18;
      const roadRight = canvas.width * 0.82;
      const roadBottom = canvas.height;
      ctx.beginPath();
      ctx.moveTo(roadLeft, 0);
      ctx.lineTo(roadRight, 0);
      ctx.lineTo(roadRight, roadBottom);
      ctx.lineTo(roadLeft, roadBottom);
      ctx.closePath();
      ctx.fill();

      const laneWidth = (roadRight - roadLeft) / 3;
      ctx.strokeStyle = 'rgba(255,255,255,0.75)';
      ctx.lineWidth = 3;
      ctx.setLineDash([18, 20]);
      for (let i = 1; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(roadLeft + laneWidth * i, 0);
        ctx.lineTo(roadLeft + laneWidth * i, canvas.height);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      ctx.strokeStyle = '#d9edf9';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(roadLeft, 0);
      ctx.lineTo(roadLeft, canvas.height);
      ctx.moveTo(roadRight, 0);
      ctx.lineTo(roadRight, canvas.height);
      ctx.stroke();
    }

    function drawPlayerCar() {
      const stats = getCarStats();
      const x = pX;
      const y = canvas.height - 118;
      const w = stats.width;
      const h = stats.height;

      ctx.save();
      ctx.translate(x, y);
      ctx.shadowBlur = 18;
      ctx.shadowColor = stats.color;

      ctx.fillStyle = stats.color;
      ctx.fillRect(-w / 2, -h / 2, w, h);

      ctx.fillStyle = '#dfeaf7';
      ctx.fillRect(-w * 0.22, -h * 0.35, w * 0.44, h * 0.28);

      ctx.fillStyle = '#0e1721';
      ctx.fillRect(-w * 0.4, -h * 0.45, w * 0.17, h * 0.9);
      ctx.fillRect(w * 0.23, -h * 0.45, w * 0.17, h * 0.9);

      ctx.fillStyle = '#1a1d22';
      ctx.fillRect(-w * 0.3, -h * 0.56, w * 0.6, h * 0.12);
      ctx.fillRect(-w * 0.3, h * 0.42, w * 0.6, h * 0.12);

      ctx.fillStyle = '#ffea7d';
      ctx.fillRect(-w * 0.18, -h * 0.52, w * 0.36, 6);

      ctx.restore();
    }

    function drawTrafficCar(car) {
      const w = car.width;
      const h = car.height;
      const x = laneToX(car.lane);
      const y = car.y;

      ctx.save();
      ctx.translate(x, y);
      if (car.turbo) {
        ctx.shadowBlur = 18;
        ctx.shadowColor = '#ffe066';
      }

      ctx.fillStyle = car.color;
      ctx.fillRect(-w / 2, -h / 2, w, h);

      ctx.fillStyle = '#dfeaf7';
      ctx.fillRect(-w * 0.22, -h * 0.28, w * 0.44, h * 0.24);

      ctx.fillStyle = '#0e1721';
      ctx.fillRect(-w * 0.4, -h * 0.45, w * 0.17, h * 0.9);
      ctx.fillRect(w * 0.23, -h * 0.45, w * 0.17, h * 0.9);

      if (car.turbo) {
        ctx.fillStyle = '#ffe066';
        ctx.fillRect(-w * 0.13, h * 0.48, w * 0.26, 5);
      }

      ctx.restore();
    }

    function drawHUDMarkers() {
      const minY = canvas.height * 0.3;
      for (let i = 0; i < 3; i++) {
        const x = laneToX(i);
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.beginPath();
        ctx.moveTo(x, minY);
        ctx.lineTo(x, canvas.height - 20);
        ctx.stroke();
      }
    }

    function draw() {
      drawBackground();
      drawHUDMarkers();
      for (const car of traffic) drawTrafficCar(car);
      drawPlayerCar();
    }

    function loop(ts) {
      if (!gameRunning) {
        draw();
        return;
      }
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function init() {
      resizeCanvas();
      resetRoad();
      draw();
      window.addEventListener('resize', () => {
        resizeCanvas();
        resetRoad();
      });
    }

    init();
    menu.classList.remove('hidden');
  </script>
</body>
</html>
