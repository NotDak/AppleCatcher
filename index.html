<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#8ad0ff" />
  <title>Apple Catcher: Defender</title>
  <style>
    :root {
      --game-width: min(94vw, 440px);
      --game-height: min(86vh, 760px);
      --sky-top: #9ee0ff;
      --sky-mid: #dff5ff;
      --grass-top: #d7f7a7;
      --grass-bottom: #b9e98a;
      --hud-bg: rgba(255,255,255,0.72);
      --panel-border: rgba(0,0,0,0.18);
      --dark: #1d2b3a;
      --gun: #333a41;
      --gun-detail: #7e8d98;
      --switch: #ffca62;
      --switch-rail: #8c5832;
      --char-skin: #f9d2a7;
      --char-shirt: #2c7be5;
      --char-pants: #223247;
      --char-bag: #6a4c3d;
      --apple-red: #d81d1d;
      --apple-dark: #9f1010;
      --apple-leaf: #3f8d2d;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #8ad0ff; font-family: Arial, sans-serif; color: var(--dark);
      touch-action: none;
    }

    body {
      display: flex; align-items: center; justify-content: center;
      padding: max(10px, env(safe-area-inset-top)) 0 max(10px, env(safe-area-inset-bottom));
    }

    #game {
      position: relative;
      width: var(--game-width); height: var(--game-height);
      border: 5px solid #2d4d3a; border-radius: 20px; overflow: hidden;
      background: linear-gradient(var(--sky-top) 0%, var(--sky-mid) 62%, var(--grass-top) 62%, var(--grass-bottom) 100%);
      box-shadow: 0 14px 30px rgba(0,0,0,0.18);
      touch-action: none;
    }

    .hud {
      position: absolute; top: 10px; left: 10px; right: 10px; z-index: 30;
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px;
    }

    .panel {
      background: var(--hud-bg); border: 3px solid var(--panel-border);
      border-radius: 12px; padding: 8px 10px; font-weight: bold; font-size: clamp(14px, 3vw, 18px);
      min-width: 90px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    #modeTag {
      min-width: 110px;
    }

    .world {
      position: absolute; inset: 0;
    }

    .ground {
      position: absolute; left: 0; right: 0; bottom: 0; height: 72px;
      background: linear-gradient(#7edc63, #5ca947); border-top: 4px solid #447a35;
      z-index: 1;
    }

    .player {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      width: 110px; height: 120px; z-index: 12;
      pointer-events: none;
      user-select: none;
    }

    .char-body {
      position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
      width: 64px; height: 78px; border-radius: 12px 12px 18px 18px;
      background: linear-gradient(var(--char-shirt), #1b5ec7);
      box-shadow: inset 0 -12px 0 rgba(0,0,0,0.12);
    }

    .head {
      position: absolute; left: 50%; top: 0; transform: translateX(-50%);
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--char-skin);
      border: 3px solid rgba(0,0,0,0.08);
      box-shadow: inset -6px -4px 0 rgba(0,0,0,0.05);
    }

    .head::before, .head::after {
      content: ""; position: absolute; top: 12px; width: 4px; height: 4px; border-radius: 50%; background: #23313d;
    }
    .head::before { left: 9px; }
    .head::after  { right: 9px; }

    .backpack {
      position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
      width: 48px; height: 54px; border-radius: 14px;
      background: linear-gradient(var(--char-bag), #4f352d);
      border: 3px solid rgba(0,0,0,0.1);
      z-index: 2;
    }

    .switch-rail {
      position: absolute; left: 50%; bottom: 42px; transform: translateX(-50%);
      width: 22px; height: 12px; border-radius: 999px;
      background: var(--switch-rail); box-shadow: inset 0 2px 4px rgba(0,0,0,0.25);
      z-index: 4;
    }

    .switch-rail::after {
      content: ""; position: absolute; left: 2px; top: 2px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--switch); box-shadow: 0 0 8px rgba(255,202,98,0.8);
      transition: left 0.15s ease;
    }

    .mode-burst .switch-rail::after { left: 12px; }

    .gun {
      position: absolute; right: 8px; bottom: 35px;
      width: 58px; height: 18px; border-radius: 10px;
      background: linear-gradient(var(--gun), #202932);
      border: 3px solid rgba(255,255,255,0.12);
      z-index: 5; transform: rotate(-10deg);
      box-shadow: inset 0 0 10px rgba(255,255,255,0.08);
    }

    .gun::before {
      content: ""; position: absolute; left: -10px; top: 2px; width: 18px; height: 10px;
      background: linear-gradient(var(--gun-detail), #586570); border-radius: 6px;
    }

    .gun::after {
      content: ""; position: absolute; right: -10px; top: 3px; width: 10px; height: 8px;
      background: linear-gradient(#444a51, #1d2127); border-radius: 4px;
    }

    .projectiles, .items {
      position: absolute; inset: 0; z-index: 15;
      pointer-events: none;
    }

    .projectile {
      position: absolute; width: 12px; height: 12px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff7d0, #ffd34c 35%, #f4a815 100%);
      box-shadow: 0 0 12px rgba(255,212,76,0.7);
      z-index: 18;
    }

    .item {
      position: absolute; width: 32px; height: 32px; border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #ffb1b1, var(--apple-red) 48%, var(--apple-dark) 100%);
      box-shadow: inset -4px -4px 0 rgba(0,0,0,0.12);
      z-index: 10;
    }

    .item::before {
      content: ""; position: absolute; width: 6px; height: 12px; left: 13px; top: -11px;
      border-radius: 50% 50% 40% 40%; background: var(--apple-leaf); transform: rotate(18deg);
    }

    .item::after {
      content: ""; position: absolute; width: 9px; height: 9px; left: 13px; top: -3px;
      border-radius: 50%; background: #6b9b2d; transform: rotate(20deg);
    }

    .message {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(10,25,25,0.45); color: white; text-align: center; z-index: 40;
    }

    .message.show { display: flex; }

    .message-box {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      padding: 20px 24px; border-radius: 18px; background: rgba(25,40,60,0.6);
      border: 3px solid rgba(255,255,255,0.18);
    }

    .message-box h2 {
      margin: 0; font-size: clamp(30px, 7vw, 44px);
    }

    .message-box button {
      padding: 12px 22px; border: none; border-radius: 12px; background: #f5bf54; color: #1d2b3a;
      font-size: 18px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game">
    <div class="hud">
      <div class="panel">Score: <span id="score">0</span></div>
      <div class="panel">Lives: <span id="lives">3</span></div>
      <div class="panel" id="modeTag">Mode: Single</div>
    </div>

    <div class="world" id="world">
      <div class="projectiles" id="projectiles"></div>
      <div class="items" id="items"></div>

      <div id="player" class="player mode-single">
        <div class="head"></div>
        <div class="backpack"></div>
        <div class="switch-rail"></div>
        <div class="gun"></div>
        <div class="char-body"></div>
      </div>

      <div class="ground"></div>
    </div>

    <div class="message show" id="message">
      <div class="message-box">
        <h2 id="messageTitle">Apple Defense</h2>
        <button id="startButton">Start Game</button>
      </div>
    </div>
  </div>

  <script>
    const game = document.getElementById('game');
    const world = document.getElementById('world');
    const player = document.getElementById('player');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const modeTag = document.getElementById('modeTag');
    const projectilesLayer = document.getElementById('projectiles');
    const itemsLayer = document.getElementById('items');
    const messageEl = document.getElementById('message');
    const messageTitle = document.getElementById('messageTitle');
    const startButton = document.getElementById('startButton');

    const modes = ['Single', 'Burst'];
    let modeIndex = 0;
    let playerX = 0;
    let playerWidth = 110;
    let gameWidth = 420;
    let gameHeight = 700;
    let score = 0;
    let lives = 3;
    let gameStarted = false;
    let gameOver = false;
    let lastTime = 0;
    let spawnTimer = 0;
    let projectileId = 0;
    let projectileSpeed = 9;
    const projectiles = [];
    const items = [];

    function updateSize() {
      const rect = game.getBoundingClientRect();
      gameWidth = rect.width;
      gameHeight = rect.height;
      playerWidth = Math.min(110, gameWidth * 0.25);
      player.style.width = playerWidth + 'px';
      playerX = Math.max(30, Math.min(playerX || (gameWidth / 2), gameWidth - 50));
      player.style.left = (playerX) + 'px';
    }

    function setPlayerPosition(clientX) {
      const rect = game.getBoundingClientRect();
      const x = clientX - rect.left;
      playerX = Math.max(30, Math.min(x, gameWidth - 30));
      player.style.left = playerX + 'px';
    }

    function updateModeUI() {
      modeTag.textContent = 'Mode: ' + modes[modeIndex];
      player.classList.toggle('mode-burst', modeIndex === 1);
      player.classList.toggle('mode-single', modeIndex === 0);
    }

    function toggleMode() {
      modeIndex = (modeIndex + 1) % modes.length;
      updateModeUI();
    }

    function startGame() {
      score = 0;
      lives = 3;
      gameStarted = true;
      gameOver = false;
      lastTime = 0;
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      messageEl.classList.remove('show');
      startButton.textContent = 'Play Again';
      while (items.length) {
        const item = items.pop(); item.el.remove();
      }
      while (projectiles.length) {
        const p = projectiles.pop(); p.el.remove();
      }
      playerX = gameWidth / 2;
      player.style.left = playerX + 'px';
      requestAnimationFrame(loop);
    }

    function showMessage(titleText, buttonText) {
      messageTitle.textContent = titleText;
      startButton.textContent = buttonText;
      messageEl.classList.add('show');
    }

    function dropItem() {
      const apple = document.createElement('div');
      apple.className = 'item';
      const x = 18 + Math.random() * (gameWidth - 50);
      const y = -20;
      apple.style.left = x + 'px';
      apple.style.top = y + 'px';
      itemsLayer.appendChild(apple);
      items.push({
        el: apple,
        x,
        y,
        speed: 2.2 + Math.random() * 2.2 + score * 0.05
      });
    }

    function fireProjectile() {
      if (!gameStarted || gameOver) return;

      const baseX = playerX + 22;
      const baseY = gameHeight - 68;
      const list = modeIndex === 1 ? [-0.22, 0, 0.22] : [0];

      list.forEach((angleOffset) => {
        const missile = document.createElement('div');
        missile.className = 'projectile';
        missile.style.left = (baseX - 6) + 'px';
        missile.style.top = (baseY - 10) + 'px';
        projectilesLayer.appendChild(missile);

        projectiles.push({
          id: ++projectileId,
          el: missile,
          x: baseX - 6,
          y: baseY - 10,
          vx: Math.sin(angleOffset) * 1.5,
          vy: -projectileSpeed,
          r: 6,
          life: 90
        });
      });
    }

    function checkHits() {
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.el.style.left = p.x + 'px';
        p.el.style.top = p.y + 'px';
        p.life--;

        if (p.life <= 0 || p.y < -20 || p.x < -10 || p.x > gameWidth + 20) {
          p.el.remove();
          projectiles.splice(i, 1);
          continue;
        }

        for (let j = items.length - 1; j >= 0; j--) {
          const item = items[j];
          const distX = p.x - (item.x + 16);
          const distY = p.y - (item.y + 16);
          if (Math.hypot(distX, distY) < 22) {
            item.el.remove();
            items.splice(j, 1);
            p.el.remove();
            projectiles.splice(i, 1);
            score += 1;
            scoreEl.textContent = score;
            break;
          }
        }
      }
    }

    function updateItems(dt) {
      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.y += item.speed * dt;
        item.el.style.top = item.y + 'px';

        if (item.y > gameHeight - 100) {
          item.el.remove();
          items.splice(i, 1);
          lives -= 1;
          livesEl.textContent = lives;

          if (lives <= 0) {
            gameOver = true;
            gameStarted = false;
            showMessage('Game Over', 'Play Again');
            return;
          }
        }
      }
    }

    function loop(ts) {
      if (!gameStarted) return;

      const delta = (ts - lastTime) || 16;
      lastTime = ts;
      spawnTimer += delta;

      if (spawnTimer > 650) {
        dropItem();
        spawnTimer = 0;
      }

      checkHits();
      updateItems(delta / 16);

      requestAnimationFrame(loop);
    }

    player.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if (!gameStarted || gameOver) return;
      fireProjectile();
    });

    game.addEventListener('pointerdown', (e) => {
      if (gameOver || !gameStarted) return;
      setPlayerPosition(e.clientX);
      fireProjectile();
    });

    game.addEventListener('pointermove', (e) => {
      if (!gameStarted || gameOver) return;
      setPlayerPosition(e.clientX);
    });

    startButton.addEventListener('click', startGame);

    player.addEventListener('dblclick', () => toggleMode());
    player.addEventListener('pointerdown', (e) => {
      const rect = player.getBoundingClientRect();
      const localX = e.clientX - rect.left;
      const localY = e.clientY - rect.top;
      if (localX < rect.width * 0.5 && localY < rect.height * 0.55) {
        toggleMode();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (!gameStarted && !gameOver) startGame();
        else if (gameStarted) fireProjectile();
      }
      if (e.key.toLowerCase() === 'm') toggleMode();
    });

    updateSize();
    updateModeUI();
    showMessage('Apple Defense', 'Start Game');
    window.addEventListener('resize', updateSize);
  </script>
</body>
</html>
